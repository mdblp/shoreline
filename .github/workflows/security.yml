name: Security

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  govulncheck_job:
    runs-on: ubuntu-latest
    name: Run govulncheck
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26
          go-package: ./...
          
  SBOM:
    uses: mdblp/.github/.github/workflows/sbom.yml@main
    with:
      app-name: notification
    secrets: inherit
